<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Max K Media</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0C0B0A">
<link rel="icon" id="ico" href="favicon.ico" sizes="any">
<link rel="icon" id="icosvg" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--void:#0C0B0A;--bone:#EDE8DF;--smoke:#9A938A;--line:rgba(237,232,223,.12);--line-strong:rgba(237,232,223,.28);
    --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--bone);font-family:var(--body);line-height:1.55;
    min-height:100svh;display:flex;align-items:center;padding:clamp(20px,5vw,64px);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .in{max-width:1500px;margin-inline:auto;width:100%}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--smoke);font-weight:600;
    display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .eyebrow::before{content:"";width:34px;height:1px;background:var(--bone);opacity:.5}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,13vw,190px);line-height:.84;
    letter-spacing:-.03em;text-transform:uppercase}
  h1 span{display:block;color:transparent;-webkit-text-stroke:1.4px var(--bone)}
  p{max-width:44ch;color:var(--smoke);margin:26px 0 34px;font-size:clamp(15px,1.4vw,18px)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .btn{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:14px 26px;
    border-radius:999px;transition:transform .25s var(--ease),background .25s var(--ease),
    color .25s var(--ease),border-color .25s var(--ease)}
  .solid{background:var(--bone);color:var(--void)}
  .solid:hover{transform:translateY(-2px)}
  .ghost{border:1px solid var(--line-strong)}
  .ghost:hover{border-color:var(--bone);background:rgba(237,232,223,.06)}
  .links{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--smoke);
    display:flex;gap:8px 22px;flex-wrap:wrap}
  .links a:hover{color:var(--bone)}
  @media(max-width:560px){.btn{width:100%;text-align:center}.row{width:100%}}
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
  <div class="in">
    <p class="eyebrow">Error 404</p>
    <h1>Nothing<span>here</span></h1>
    <p>That page has moved or never existed. Everything else is still where you left it.</p>
    <div class="row">
      <a class="btn solid" data-to="index.html">Back to the start</a>
      <a class="btn ghost" data-to="index.html#contact">Get in touch</a>
    </div>
    <nav class="links">
      <a data-to="web.html">Web</a>
      <a data-to="photography.html">Photography</a>
      <a data-to="automation.html">Automation</a>
      <a data-to="locations.html">Service areas</a>
      <a href="mailto:krausemax44@gmail.com">krausemax44@gmail.com</a>
      <a href="tel:+61490365553">0490 365 553</a>
    </nav>
  </div>
<script>
  /* 404.html can be served at any depth on GitHub Pages, so work out where the
     site root actually is: /<repo>/ on a project site, / everywhere else. */
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var base = (/\.github\.io$/i.test(location.hostname) && seg.length) ? '/' + seg[0] + '/' : '/';
    document.querySelectorAll('[data-to]').forEach(function (a) {
      a.href = base + a.dataset.to;
    });
    document.getElementById('ico').href = base + 'favicon.ico';
    document.getElementById('icosvg').href = base + 'favicon.svg';
  })();
</script>
</body>
</html>
